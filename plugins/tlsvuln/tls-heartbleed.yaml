id: tls-heartbleed
title: TLS Heartbleed (CVE-2014-0160)
severity: critical
source: tlsvuln
when: |
  vulnerabilities != nil and any(vulnerabilities, {
    .id matches "(?i)heartbleed" and .finding matches "(?i)VULNERABLE"
  })
evidence: |
  {{ .host }}:{{ .port }} OpenSSL Heartbleed
references:
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2014-0160
  - https://heartbleed.com/
remediation: |
  Upgrade OpenSSL to 1.0.1g or later. Rotate all server keys and any
  passwords / session tokens that may have transited the affected
  listener (Heartbleed exposes up to 64 KB of process memory per leak).
tags: [tls, heartbleed, cve-2014-0160]
