id: tls-deprecated-protocol
title: Deprecated TLS version offered (TLS 1.0 / TLS 1.1)
severity: medium
source: tlsvuln
when: |
  protocols != nil and any(protocols, {
    (.id == "TLS1" || .id == "TLS1_1") and .finding matches "(?i)offered"
  })
evidence: '{{ .host }}:{{ .port }} deprecated TLS version accepted (TLS 1.0/1.1 offered)'
references:
  - https://datatracker.ietf.org/doc/rfc8996/
  - https://www.pcisecuritystandards.org/document_library
remediation: |
  Disable TLS 1.0 and TLS 1.1. RFC 8996 formally deprecates both versions
  and PCI DSS 4.0 forbids them after March 2025. Configure the server to
  require TLS 1.2 minimum (TLS 1.3 preferred). In OpenSSL config set
  MinProtocol = TLSv1.2. In Nginx: ssl_protocols TLSv1.2 TLSv1.3;
tags: [tls, deprecated, tls1.0, tls1.1, compliance, pci-dss]
