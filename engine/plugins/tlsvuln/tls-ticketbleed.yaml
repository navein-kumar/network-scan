id: tls-ticketbleed
title: F5 BIG-IP Ticketbleed (CVE-2016-9244)
severity: high
source: tlsvuln
when: |
  vulnerabilities != nil and any(vulnerabilities, {
    .id matches "(?i)ticketbleed" and .finding matches "(?i)VULNERABLE"
  })
evidence: '{{ .host }}:{{ .port }} F5 BIG-IP Ticketbleed'
references:
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2016-9244
  - https://ticketbleed.com/
remediation: |
  Upgrade F5 BIG-IP to a patched release (11.6.1 HF2, 12.1.2 HF1, ...).
  As a workaround disable session tickets on the affected virtual server
  until the upgrade can be applied.
tags: [tls, ticketbleed, cve-2016-9244, f5]
